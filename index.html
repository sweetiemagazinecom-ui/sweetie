<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sweetie</title>
<link rel="icon" type="image/png" sizes="32x32" href="marca/favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="marca/favicon-512.png">
<link rel="apple-touch-icon" href="marca/apple-touch-icon.png">
<meta property="og:title" content="Sweetie">
<meta property="og:description" content="Revista digital de Julieta Ochoa.">
<meta property="og:image" content="marca/sweetie-redes-1200x630.png">
<meta name="description" content="Sweetie, revista digital de Julieta Ochoa: música, cine y series, medios y cultura.">
<link rel="preload" href="fonts/girly-moods.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
<style>
/* Diario digital: barra de servicio, cabecera con logo, menú de secciones fijo, portada en grilla de 12 columnas con nota principal + columna "Lo último", bloques por sección y página de nota a una columna. */
@font-face{font-family:"Girly Moods";src:url("fonts/girly-moods.ttf") format("truetype");font-display:swap}
:root{
  --paper:#FFFFFF;--paper-2:#F2F8F9;--ink:#13343B;--ink-2:#3F5D64;--muted:#6B858A;
  --band:#84BCC8;--band-deep:#2F6E7A;--accent:#C2506E;--co:#C2506E;--rule:#D5E3E6;--rule-strong:#13343B;
  --logo:"Girly Moods","Brush Script MT",cursive;
  --head:"Newsreader",Georgia,"Times New Roman",serif;
  --ui:"Jost","Futura","Avenir Next",system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0F1E21;--paper-2:#15292D;--ink:#E7F1F3;--ink-2:#B7CDD1;--muted:#8DA8AD;--band:#4E8E9B;--band-deep:#1D4A53;--accent:#EE8FA8;--co:#9E3D5A;--rule:#24393D;--rule-strong:#E7F1F3;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0F1E21;--paper-2:#15292D;--ink:#E7F1F3;--ink-2:#B7CDD1;--muted:#8DA8AD;--band:#4E8E9B;--band-deep:#1D4A53;--accent:#EE8FA8;--co:#9E3D5A;--rule:#24393D;--rule-strong:#E7F1F3;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--band-deep);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* barra de servicio */
.util{background:var(--band-deep);color:#fff;font-size:13px}
.util .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:34px}
.util .date::first-letter{text-transform:uppercase}
.util nav{display:flex;gap:16px}
.util a{opacity:.9}.util a:hover{opacity:1;text-decoration:underline}
/* cabecera */
.mast{background:var(--band);color:#fff;text-align:center}
.mast .wrap{padding-block:8px 10px}
.logo{display:inline-block;font-family:var(--logo);font-weight:400;font-size:clamp(50px,7vw,88px);line-height:1.05}
.mast .claim{margin:0;font-size:11px;letter-spacing:.24em;text-transform:uppercase;opacity:.95}
/* menú */
.menu{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:3px double var(--rule-strong)}
.menu .wrap{display:flex;align-items:center;gap:4px}
.menu .mini{display:none;font-family:var(--logo);font-size:34px;line-height:1;color:var(--band-deep);margin-right:12px}
.menu.stuck .mini{display:inline-block}
.menu ul{display:flex;gap:0;margin:0;padding:0;list-style:none;overflow-x:auto;scrollbar-width:none;flex:1}
.menu ul::-webkit-scrollbar{display:none}
.menu li a{display:flex;align-items:center;min-height:46px;padding:0 14px;font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-3px}
.menu li a:hover{color:var(--band-deep)}
.menu li a[aria-current="page"]{border-bottom-color:var(--accent)}
.menu li.pp a{color:var(--band-deep)}
/* último momento */
.flash{border-bottom:1px solid var(--rule)}
.flash .wrap{display:flex;align-items:center;gap:14px;min-height:42px;overflow:hidden}
.flash b{flex:none;padding:3px 8px;background:var(--accent);color:#fff;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.flash .items{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;font-size:14px;white-space:nowrap}
.flash .items::-webkit-scrollbar{display:none}
.flash .items a:hover{text-decoration:underline}
.flash .items a+a::before{content:"·";margin-right:22px;color:var(--muted)}

main{padding-block:28px 48px}
/* piezas comunes */
.vol{display:block;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--band-deep)}
.vol.pp{color:var(--accent)}
.h{font-family:var(--head);font-weight:500;line-height:1.12;letter-spacing:-.005em;text-wrap:balance;margin:6px 0 0}
a:hover .h{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.dek{font-family:var(--head);color:var(--ink-2);margin:8px 0 0;line-height:1.45}
.meta{margin-top:8px;font-size:13px;color:var(--muted)}
.ph{position:relative;overflow:hidden;background:var(--paper-2)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph.empty{display:grid;place-items:center}
.ph.empty span{font-family:var(--logo);font-size:44px;color:var(--band)}
/* portada */
.front{display:grid;grid-template-columns:minmax(0,8fr) minmax(0,4fr);gap:0 32px}
.lead .ph{aspect-ratio:16/9}
.lead .h{font-size:clamp(30px,4.2vw,48px);margin-top:12px}
.lead .dek{font-size:clamp(18px,1.8vw,21px)}
.lead .vol{margin-top:16px}
.side{border-left:1px solid var(--rule);padding-left:32px}
.blockhead{display:flex;align-items:center;gap:12px;margin:0 0 14px;font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.blockhead::after{content:"";flex:1;height:1px;background:var(--rule-strong)}
.blockhead a{order:2;font-size:12px;letter-spacing:.1em;color:var(--band-deep);font-weight:600}
.latest{margin:0;padding:0;list-style:none}
.latest li{padding:14px 0;border-bottom:1px solid var(--rule)}
.latest li:first-child{padding-top:0}
.latest time{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.latest .h{font-size:19px;margin-top:4px}
.row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px 24px;margin-top:36px;padding-top:24px;border-top:1px solid var(--rule)}
.card .ph{aspect-ratio:3/2}
.card .vol{margin-top:12px}
.card .h{font-size:20px}
.sec{margin-top:44px}
.secgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr);gap:24px}
.secgrid .big .ph{aspect-ratio:16/10}
.secgrid .big .h{font-size:28px}
.secgrid .card .h{font-size:19px}
/* Ponele Play */
.co-band{background:var(--co);color:#fff}
.co-band .wrap{padding-block:28px 32px;display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:20px 40px;align-items:center}
.co-band h2{margin:0;font-family:var(--logo);font-weight:400;font-size:clamp(56px,7vw,84px);line-height:1}
.co-band .live{display:inline-flex;align-items:center;gap:8px;margin-top:8px;padding:4px 12px 4px 10px;border:1.5px solid #fff;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.26em;text-transform:uppercase}
.co-band .live i{width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.3)}
.co-band .live.on i{background:#FF3B30;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.co-band p{margin:10px 0 0;font-family:var(--head);font-size:18px;line-height:1.45;opacity:.95}
.co-band .go{display:inline-flex;align-items:center;gap:8px;margin-top:16px;min-height:44px;padding:0 18px;border-radius:999px;background:#fff;color:var(--co);font-weight:600;font-size:14px}
.co-prog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.co-prog>*{background:rgba(255,255,255,.14);padding:14px 16px;min-width:0}
.co-prog b{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.co-prog span{display:block;margin-top:4px;font-family:var(--head);font-size:19px;line-height:1.3}
.co-prog a:hover span{text-decoration:underline}
.co-soon{font-family:var(--head);font-size:19px;opacity:.9}
.pp-band{margin-top:0;background:var(--band-deep);color:#fff}
.pp-band .wrap{padding-block:28px 32px;display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:24px 40px;align-items:start}
.pp-band h2{margin:0;font-family:var(--logo);font-weight:400;font-size:clamp(56px,7vw,84px);line-height:1}
.pp-band p{margin:6px 0 0;font-family:var(--head);font-size:18px;line-height:1.45;opacity:.92}
.pp-band .go{display:inline-flex;align-items:center;gap:8px;margin-top:16px;min-height:44px;padding:0 18px;border-radius:999px;background:#fff;color:var(--band-deep);font-weight:600;font-size:14px}
.pp-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.pp-list .vol{color:#fff;opacity:.75}
.pp-list .h{font-size:19px;color:#fff}
.pp-list .ph{aspect-ratio:1/1;background:rgba(255,255,255,.12)}
.pp-cta{align-self:center;display:flex;align-items:center;gap:18px;padding:18px 24px 18px 18px;border-radius:18px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.4);color:#fff;text-decoration:none;transition:background .2s}
.pp-cta:hover{background:rgba(255,255,255,.2)}
.pp-play{flex:none;width:58px;height:58px;border-radius:50%;background:#fff;color:var(--band-deep);display:grid;place-items:center;padding-left:3px;transition:transform .2s}
.pp-cta:hover .pp-play{transform:scale(1.06)}
.pp-txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.pp-txt b{font-family:var(--head);font-weight:500;font-size:clamp(19px,2.2vw,24px);line-height:1.25}
.pp-txt small{font-size:14px;opacity:.88}
.pp-empty{font-family:var(--head);font-size:18px;opacity:.85;align-self:center}
/* página de sección */
.sechead{padding-bottom:16px;margin-bottom:24px;border-bottom:3px double var(--rule-strong)}
.sechead h1{margin:0;font-family:var(--head);font-weight:500;font-size:clamp(40px,6vw,64px);line-height:1}
.sechead.pp h1{font-family:var(--logo);font-weight:400;color:var(--band-deep)}
.sec .list .item{border-bottom:0;padding-top:0}
.list .item{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:20px;padding:20px 0;border-bottom:1px solid var(--rule)}
.list .item .ph{aspect-ratio:3/2}
.list .item .h{font-size:26px}
.none{padding:48px 0;text-align:center;color:var(--muted);font-family:var(--head);font-size:20px}
/* nota */
.art{max-width:760px;margin:0 auto}
.crumb{font-size:13px;color:var(--muted)}
.crumb a{color:var(--band-deep);font-weight:600}
.art .volanta{margin:18px 0 0;font-size:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.art .volanta+h1{margin-top:6px}
.art h1{margin:14px 0 0;font-family:var(--head);font-weight:500;font-size:clamp(34px,5.4vw,56px);line-height:1.08;letter-spacing:-.01em;text-wrap:balance}
.art .dek{font-size:clamp(19px,2.2vw,23px);margin-top:14px}
.byline{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 16px;margin-top:20px;padding-block:12px;border-block:1px solid var(--rule);font-size:14px;color:var(--ink-2)}
.byline strong{color:var(--ink)}
.share{display:flex;gap:8px}
.share a,.share button{display:inline-flex;align-items:center;min-height:34px;padding:0 12px;border:1px solid var(--rule);border-radius:999px;background:none;font-size:13px;cursor:pointer}
.share a:hover,.share button:hover{border-color:var(--ink)}
.art figure{margin:24px 0 0}
.art figure .ph{aspect-ratio:16/9}
.art figcaption{margin-top:8px;padding-left:10px;border-left:2px solid var(--band);font-size:13px;color:var(--muted)}
.body{margin-top:28px;font-family:var(--head);font-size:20px;line-height:1.7}
.body.dc>p:first-of-type::first-letter{float:left;font-size:3.4em;line-height:.85;padding:6px 10px 0 0;font-weight:600;color:var(--band-deep)}
.body p{margin:0 0 1.1em}
.body h2{margin:1.5em 0 .5em;font-family:var(--ui);font-size:22px;font-weight:600;line-height:1.3}
.body blockquote{margin:1.4em 0;padding:4px 0 4px 22px;border-left:3px solid var(--accent);font-size:24px;font-style:italic;line-height:1.4}
.body a{color:var(--band-deep);text-decoration:underline}
.body img{margin:1em 0}
.embed{position:relative;margin:1.6em 0;aspect-ratio:16/9;background:var(--paper-2)}
.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.embed.v{aspect-ratio:9/16;max-width:340px;margin-inline:auto}
.embed.ig{aspect-ratio:auto;height:720px;max-width:480px;margin-inline:auto;background:none}
.embed.sp{aspect-ratio:auto;height:352px;background:none}.embed.sp.sm{height:152px}
.orig{margin-top:8px;padding:14px 16px;background:var(--paper-2);font-size:15px}
.orig a{font-weight:600;text-decoration:underline}
.related{margin-top:48px}
.related .row{margin-top:0;padding-top:0;border-top:0;grid-template-columns:repeat(3,minmax(0,1fr))}
/* pie */
footer{margin-top:0;background:var(--ink);color:var(--paper)}
footer .wrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:28px;padding-block:36px 24px}
footer .flogo{font-family:var(--logo);font-size:64px;line-height:1}
footer p{margin:6px 0 0;font-size:14px;opacity:.8;max-width:34ch}
footer h3{margin:0 0 10px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.7}
footer ul{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:15px}
footer a:hover{text-decoration:underline}
footer .legal{grid-column:1/-1;padding-top:16px;border-top:1px solid rgba(255,255,255,.18);font-size:13px;opacity:.7}
@media (max-width:900px){
  .front{grid-template-columns:1fr}
  .side{border-left:0;padding-left:0;margin-top:28px}
  .row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .secgrid{grid-template-columns:1fr 1fr}.secgrid .big{grid-column:1/-1}
  .pp-band .wrap,.co-band .wrap{grid-template-columns:1fr}
  footer .wrap{grid-template-columns:1fr 1fr}footer .about{grid-column:1/-1}
}
@media (max-width:560px){
  .row,.secgrid,.pp-list,.related .row,.co-prog{grid-template-columns:1fr}
  .pp-list{grid-template-columns:repeat(2,minmax(0,1fr))}
  .list .item{grid-template-columns:1fr}
  .util nav{display:none}
  .body{font-size:19px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
/* campanita de notificaciones */
.bell{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;width:58px;height:58px;border-radius:50%;border:0;background:var(--band-deep);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 24px rgba(19,52,59,.3);transition:transform .2s}
.bell:hover{transform:scale(1.06)}
.bell svg{display:block}
.bell .dot{position:absolute;top:12px;right:13px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--band-deep)}
.bell.on .dot{display:none}
.bell.on{background:var(--paper);color:var(--band-deep);box-shadow:0 10px 24px rgba(19,52,59,.25),inset 0 0 0 2px var(--band-deep)}
.bell-tip{position:absolute;right:68px;bottom:8px;width:max-content;max-width:min(260px,calc(100vw - 110px));padding:9px 14px;border-radius:12px;background:var(--ink);color:var(--paper);font-family:var(--ui);font-size:14px;line-height:1.35;text-align:left;opacity:0;transform:translateX(6px);pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.bell:hover .bell-tip,.bell:focus-visible .bell-tip,.bell.show-tip .bell-tip{opacity:1;transform:none}
@media (hover:none){.bell:hover .bell-tip{opacity:0}.bell.show-tip .bell-tip{opacity:1}}
</style>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
window.OneSignalDeferred=window.OneSignalDeferred||[];

  function upd(){var on=false;try{on=!!O.User.PushSubscription.optedIn}catch(e){}b.classList.toggle('on',on);b.setAttribute('aria-label',on?'Ya recibís las notas nuevas de Sweetie':'Recibí las notas nuevas de Sweetie')}

    }catch(e){}

});

</head>
<body>

<div class="util"><div class="wrap"><span class="date" id="today"></span><nav aria-label="Redes" id="social"></nav></div></div>
<header class="mast"><div class="wrap"><a class="logo" href="#" id="logo">Sweetie</a><p class="claim" id="claim"></p></div></header>
<nav class="menu" id="menu" aria-label="Secciones"><div class="wrap"><a class="mini" href="#" aria-hidden="true" tabindex="-1">Sweetie</a><ul id="secs"></ul></div></nav>
<div class="flash" id="flash" hidden><div class="wrap"><b>Lo último</b><div class="items" id="flash-items"></div></div></div>
<main id="view" class="wrap"></main>
<footer><div class="wrap">
<div class="about"><div class="flogo">Sweetie</div><p id="fabout"></p></div>
<div><h3>Secciones</h3><ul id="fsecs"></ul></div>
<div><h3>Seguinos</h3><ul id="fsocial"></ul></div>
<div class="legal" id="legal"></div>
</div></footer>

<button type="button" class="bell" id="bell" hidden aria-label="Recibí las notas nuevas de Sweetie"><svg class="ring" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="dot" aria-hidden="true"></span><span class="bell-tip" id="bell-tip">Recibí las notas nuevas</span></button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(function(){
var DEF_SECS=['Actualidad','Música','Cine y series','Medios','Cultura','Ponele Play'];
var DATA={name:'Sweetie',tagline:'',sections:DEF_SECS,articles:[]};
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function slug(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60)}
var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function fdate(iso){var p=String(iso||'').split('-');if(p.length<3)return '';return (+p[2])+' de '+MESES[(+p[1])-1]+' de '+p[0]}
function sdate(iso){var p=String(iso||'').split('-');if(p.length<3)return '';return (+p[2])+' '+MESES[(+p[1])-1].slice(0,3)+'.'}
function words(t){return String(t||'').replace(/[#>*_\[\]()]/g,' ').split(/\s+/).filter(Boolean).length}
function embed(u){var m,src,cls='';u=String(u).replace(/&amp;/g,'&');
  if(m=u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/)){src='https://www.youtube-nocookie.com/embed/'+m[1];if(/shorts\//.test(u))cls=' v'}
  else if(m=u.match(/vimeo\.com\/(\d+)/)){src='https://player.vimeo.com/video/'+m[1]}
  else if(m=u.match(/tiktok\.com\/@[^\/]+\/video\/(\d+)/)){src='https://www.tiktok.com/embed/v2/'+m[1];cls=' v'}
  else if(m=u.match(/instagram\.com\/(p|reel|reels|tv)\/([\w-]+)/)){src='https://www.instagram.com/'+(m[1]==='reels'?'reel':m[1])+'/'+m[2]+'/embed';cls=' ig'}
  else if(m=u.match(/open\.spotify\.com\/(?:intl-\w+\/)?(track|album|playlist|episode|show|artist)\/(\w+)/)){src='https://open.spotify.com/embed/'+m[1]+'/'+m[2];cls=' sp'+(/track|episode/.test(m[1])?' sm':'')}
  if(!src)return null;
  return '<div class="embed'+cls+'"><iframe src="'+esc(src)+'" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" allowfullscreen title="Contenido incrustado"></iframe></div>'}
function md(t){t=String(t||'');var h;try{if(window.marked){h=marked.parse(t).replace(/<script[\s\S]*?<\/script>/gi,'').replace(/ on\w+="[^"]*"/gi,'')}}catch(e){}
  if(h==null)h=t.split(/\n\s*\n/).map(function(p){return '<p>'+esc(p)+'</p>'}).join('');
  h=h.replace(/<p>\s*(?:<a href="([^"]+)"[^>]*>[^<]*<\/a>|(https?:\/\/[^\s<]+))\s*<\/p>/g,function(all,a,b){return embed(a||b)||all});
  return h.replace(/<a href="(https?:\/\/[^"]+)"/g,'<a href="$1" target="_blank" rel="noopener"')}
function sorted(){return DATA.articles.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0})}
function cats(a){var x=a.also;x=Array.isArray(x)?x:String(x||'').split(',');return [a.category].concat(x).map(function(c){return String(c||'').trim()}).filter(function(c,i,arr){return c&&arr.map(slug).indexOf(slug(c))===i})}
function inSec(a,k){return cats(a).some(function(c){return slug(c)===k})}
function sections(){var s=(DATA.sections&&DATA.sections.length?DATA.sections:DEF_SECS).slice();sorted().forEach(function(a){cats(a).forEach(function(c){if(!s.some(function(x){return slug(x)===slug(c)}))s.push(c)})});return s}
function isPP(c){return slug(c)==='ponele-play'}
function ph(a,eager){return a.image?'<div class="ph"><img src="'+esc(String(a.image).replace(/^\//,''))+'" alt="'+esc(a.imageAlt||'')+'"'+(eager?'':' loading="lazy"')+'></div>':'<div class="ph empty" aria-hidden="true"><span>Sweetie</span></div>'}
function vol(a){return '<span class="vol'+(isPP(a.category)?' pp':'')+'">'+esc(a.kicker||a.category||'Nota')+'</span>'}
function href(a){return '#nota-'+esc(a.id)}
function card(a,cls){return '<a class="card '+(cls||'')+'" href="'+href(a)+'">'+ph(a)+vol(a)+'<h3 class="h">'+esc(a.title)+'</h3>'+(cls==='big'&&a.dek?'<p class="dek">'+esc(a.dek)+'</p>':'')+'</a>'}

function chrome(cur){
  $('today').textContent=new Intl.DateTimeFormat('es-AR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());
  $('claim').textContent=DATA.tagline||'';
  var soc=[['Instagram',DATA.instagram],['TikTok',DATA.tiktok],['Spotify',DATA.playlist],['Cornelia en vivo',DATA.coLink]].filter(function(x){return x[1]});
  $('social').innerHTML=soc.map(function(x){return '<a href="'+esc(x[1])+'" target="_blank" rel="noopener">'+x[0]+'</a>'}).join('');
  $('fsocial').parentNode.hidden=!soc.length;$('fsocial').innerHTML=soc.map(function(x){return '<li><a href="'+esc(x[1])+'" target="_blank" rel="noopener">'+x[0]+'</a></li>'}).join('');
  var li='<li><a href="#"'+(!cur?' aria-current="page"':'')+'>Portada</a></li>';
  sections().forEach(function(s){var k=slug(s);li+='<li'+(isPP(s)?' class="pp"':'')+'><a href="#seccion-'+k+'"'+(cur===k?' aria-current="page"':'')+'>'+esc(s)+'</a></li>'});
  $('secs').innerHTML=li;
  $('fsecs').innerHTML=sections().map(function(s){return '<li><a href="#seccion-'+slug(s)+'">'+esc(s)+'</a></li>'}).join('');
  $('fabout').textContent=DATA.about||'Revista digital de Julieta Ochoa.';
  $('legal').textContent='© '+new Date().getFullYear()+' Sweetie · Dirección: Julieta Ochoa · Buenos Aires';
  var l=sorted().slice(0,5);
  $('flash').hidden=!l.length;
  $('flash-items').innerHTML=l.map(function(a){return '<a href="'+href(a)+'">'+esc(a.title)+'</a>'}).join('');
}
function coBand(){
  if(DATA.cornelia===false)return '';
  var items=[['Próximo vivo',DATA.coNext],['Invitada',DATA.coGuest],['Último programa',DATA.coLastTitle,DATA.coLastLink]].filter(function(x){return x[1]});
  var on=DATA.coLiveNow===true;
  return '<section class="co-band" aria-label="Cornelia en vivo"><div class="wrap"><div><h2>Cornelia</h2><span class="live'+(on?' on':'')+'"><i></i>'+(on?'Ahora en vivo':'En vivo')+'</span>'+
    '<p>'+esc(DATA.coText||'El canal de streaming de Sweetie. Charlas, invitados y lo que está pasando, en vivo.')+'</p>'+
    (DATA.coLink?'<a class="go" href="'+esc(DATA.coLink)+'" target="_blank" rel="noopener">'+(on?'Mirá el vivo':'Ir al canal')+' ↗</a>':'')+'</div>'+
    (items.length?'<div class="co-prog">'+items.map(function(x){var inner='<b>'+x[0]+'</b><span>'+esc(x[1])+(x[2]?' ↗':'')+'</span>';return x[2]?'<a href="'+esc(x[2])+'" target="_blank" rel="noopener">'+inner+'</a>':'<div>'+inner+'</div>'}).join('')+'</div>':'<p class="co-soon">Muy pronto, el primer vivo.</p>')+
    '</div></section>';
}
function ppBand(exclude){
  var pp=sorted().filter(function(a){return inSec(a,'ponele-play')&&exclude.indexOf(a)<0}).slice(0,3);
  return '<section class="pp-band" aria-label="Ponele Play"><div class="wrap"><div><h2>Ponele Play</h2><p>'+esc(DATA.ppText||'Lo que estoy escuchando, viendo y recomendando.')+'</p>'+
    (DATA.playlist&&pp.length?'<a class="go" href="'+esc(DATA.playlist)+'" target="_blank" rel="noopener">Escuchá la playlist ↗</a>':'')+'</div>'+
    (pp.length?'<div class="pp-list">'+pp.map(function(a){return '<a class="card" href="'+href(a)+'">'+ph(a)+'<span class="vol">'+esc(fdate(a.date))+'</span><h3 class="h">'+esc(a.title)+'</h3></a>'}).join('')+'</div>':(DATA.playlist?'<a class="pp-cta" href="'+esc(DATA.playlist)+'" target="_blank" rel="noopener"><span class="pp-play" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></span><span class="pp-txt"><b>Hacé click y escuchá las recomendaciones del día</b><small>Dale play y empezá bien el día ↗</small></span></a>':'<p class="pp-empty">Muy pronto, las primeras recomendaciones.</p>'))+
    '</div></section>';
}
function listItem(a){return '<a class="item" href="'+href(a)+'">'+ph(a)+'<div><span class="vol">'+esc(fdate(a.date))+'</span><h2 class="h">'+esc(a.title)+'</h2>'+(a.dek?'<p class="dek">'+esc(a.dek)+'</p>':'')+'<div class="meta">Por '+esc(a.author||'Julieta Ochoa')+'</div></div></a>'}
function home(){
  var all=sorted(),v=$('view');
  if(!all.length){v.innerHTML='<p class="none">Todavía no hay notas publicadas.</p>';v.insertAdjacentHTML('afterend',ppBand([])+coBand());return}
  var news=all.filter(function(a){return !isPP(a.category)});if(!news.length)news=all;
  var lead=news.filter(function(a){return a.featured})[0]||news[0];
  var rest=news.filter(function(a){return a!==lead});
  var side=rest.slice(0,5);
  var used=[lead].concat(side);
  var h='<div class="front"><a class="lead" href="'+href(lead)+'">'+ph(lead,true)+vol(lead)+'<h2 class="h">'+esc(lead.title)+'</h2>'+(lead.dek?'<p class="dek">'+esc(lead.dek)+'</p>':'')+'<div class="meta">Por '+esc(lead.author||'Julieta Ochoa')+' · '+esc(fdate(lead.date))+'</div></a>';
  h+='<aside class="side"><h2 class="blockhead">Lo último</h2>'+(side.length?'<ul class="latest">'+side.map(function(a){return '<li><a href="'+href(a)+'"><time datetime="'+esc(a.date)+'">'+esc(sdate(a.date))+'</time>'+vol(a)+'<h3 class="h">'+esc(a.title)+'</h3></a></li>'}).join('')+'</ul>':'<p class="meta">Muy pronto, más notas.</p>')+'</aside></div>';
  var more=rest.slice(5,9);used=used.concat(more);
  if(more.length)h+='<div class="row">'+more.map(function(a){return card(a)}).join('')+'</div>';
  sections().forEach(function(s){
    if(isPP(s))return;
    var list=all.filter(function(a){return inSec(a,slug(s))&&used.indexOf(a)<0}).slice(0,3);
    if(!list.length)return;used=used.concat(list);
    var inner=list.length===1?'<div class="list">'+listItem(list[0])+'</div>':'<div class="secgrid">'+list.map(function(a,i){return card(a,i===0?'big':'')}).join('')+'</div>';
    h+='<section class="sec"><h2 class="blockhead"><a href="#seccion-'+slug(s)+'">Ver todo →</a>'+esc(s)+'</h2>'+inner+'</section>';
  });
  v.innerHTML=h;
  document.querySelectorAll('.pp-band,.co-band').forEach(function(b){b.remove()});
  v.insertAdjacentHTML('afterend',ppBand([])+coBand());
}
function section(k){
  var name=sections().filter(function(s){return slug(s)===k})[0]||k;
  var list=sorted().filter(function(a){return inSec(a,k)});
  document.title=name+' · Sweetie';
  var h='<header class="sechead'+(isPP(name)?' pp':'')+'"><h1>'+esc(name)+'</h1></header>';
  h+=list.length?'<div class="list">'+list.map(listItem).join('')+'</div>':'<p class="none">Todavía no hay notas en esta sección.</p>';
  $('view').innerHTML=h;
}
function autolink(root){
  var list=(DATA.links||[]).filter(function(l){return l&&l.name&&l.url&&String(l.name).trim().length>1}).map(function(l){return {name:String(l.name).trim(),url:String(l.url).trim()}});
  if(!root||!list.length)return;
  list.sort(function(a,b){return b.name.length-a.name.length});
  var reEsc=function(t){return t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')};
  list.forEach(function(l){
    if(root.querySelector('a[href="'+l.url.replace(/"/g,'\\"')+'"]'))return;
    var re;try{re=new RegExp('(^|[^\\p{L}\\p{N}])('+reEsc(l.name)+')(?![\\p{L}\\p{N}])','iu')}catch(e){return}
    var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){for(var p=n.parentNode;p&&p!==root;p=p.parentNode){if(/^(A|H1|H2|H3|BLOCKQUOTE|FIGCAPTION)$/.test(p.nodeName))return NodeFilter.FILTER_REJECT}return NodeFilter.FILTER_ACCEPT}});
    var n;while((n=w.nextNode())){var m=re.exec(n.nodeValue);if(!m)continue;
      var start=m.index+m[1].length,mid=n.splitText(start);mid.splitText(m[2].length);
      var a=document.createElement('a');a.href=l.url;a.target='_blank';a.rel='noopener';a.textContent=mid.nodeValue;mid.parentNode.replaceChild(a,mid);break}
  });
}
function article(id){
  var a=DATA.articles.filter(function(x){return x.id===id})[0],v=$('view');
  if(!a){v.innerHTML='<p class="none">No encontramos esta nota. <a href="#">Volver a la portada</a></p>';return}
  document.title=a.title+' · Sweetie';
  var mins=Math.max(1,Math.round(words(a.body)/200));
  var url=location.href;
  var rel=sorted().filter(function(x){return x!==a&&cats(x).some(function(c){return inSec(a,slug(c))})});
  rel=rel.concat(sorted().filter(function(x){return x!==a&&rel.indexOf(x)<0})).slice(0,3);
  var h='<article class="art"><div class="crumb"><a href="#">Portada</a> / '+cats(a).map(function(c){return '<a href="#seccion-'+slug(c)+'">'+esc(c)+'</a>'}).join(' · ')+'</div>'+
    (a.kicker?'<p class="volanta">'+esc(a.kicker)+'</p>':'')+'<h1>'+esc(a.title)+'</h1>'+(a.dek?'<p class="dek">'+esc(a.dek)+'</p>':'')+
    '<div class="byline"><span>Por <strong>'+esc(a.author||'Julieta Ochoa')+'</strong> · '+esc(fdate(a.date))+' · '+mins+' min de lectura</span>'+
    '<span class="share"><a href="https://wa.me/?text='+encodeURIComponent(a.title+' '+url)+'" target="_blank" rel="noopener">WhatsApp</a><a href="https://twitter.com/intent/tweet?text='+encodeURIComponent(a.title)+'&url='+encodeURIComponent(url)+'" target="_blank" rel="noopener">X</a><button type="button" id="copy">Copiar link</button></span></div>'+
    (a.image?'<figure>'+ph(a,true)+(a.credit?'<figcaption>'+esc(a.credit)+'</figcaption>':'')+'</figure>':'')+
    '<div class="body'+(words(a.body)>60?' dc':'')+'">'+md(a.body)+'</div>'+
    (a.link?'<p class="orig">Leé la nota completa en <a href="'+esc(a.link)+'" target="_blank" rel="noopener">'+esc(a.link.replace(/^https?:\/\/(www\.)?/,'').split('/')[0])+' ↗</a></p>':'')+
    '</article>';
  if(rel.length)h+='<section class="related wrap" style="padding:0"><h2 class="blockhead">Te puede interesar</h2><div class="row">'+rel.map(function(x){return card(x)}).join('')+'</div></section>';
  v.innerHTML=h;
  try{autolink(v.querySelector('.body'))}catch(e){}
  $('copy').onclick=function(){var b=this;try{navigator.clipboard.writeText(url).then(function(){b.textContent='Link copiado'},function(){b.textContent=url})}catch(e){b.textContent=url}};
  window.scrollTo(0,0);
}
function route(){
  var h=location.hash.replace(/^#/,'');document.querySelectorAll('.pp-band,.co-band').forEach(function(b){b.remove()});
  if(h.indexOf('nota-')===0){chrome(null);article(h.slice(5))}
  else if(h.indexOf('seccion-')===0){chrome(h.slice(8));section(h.slice(8))}
  else{chrome(null);document.title='Sweetie';home()}
}
window.addEventListener('hashchange',route);
var menu=$('menu');
try{new IntersectionObserver(function(e){menu.classList.toggle('stuck',!e[0].isIntersecting)}).observe(document.querySelector('.mast'))}catch(e){}
fetch('data/notas.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(d){
  DATA=Object.assign(DATA,d||{});
  DATA.articles=(DATA.articles||[]).map(function(a,i){a.id=a.id||slug(a.title)||('nota-'+i);a.date=String(a.date||'').slice(0,10);return a});
  route();
}).catch(function(){$('view').innerHTML='<p class="none">No pudimos cargar las notas. Probá recargar la página.</p>'});
chrome(null);
})();
</script>
</body>
</html>
